name: Nexora Foundry Release Validation

on:
  pull_request:
    paths:
      - ".github/workflows/release-validation.yml"
      - "core/movie_pipeline/**"
      - "blender/**"
      - "gameplay/**"
      - "scripts/release/**"
      - "tests/integration/test_blender_to_godot.py"
      - "tests/export/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-validation:
    name: Generate game and export Linux, Windows and Android builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17 for Android export
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Blender and its glTF export dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y blender python3-numpy

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Set up Godot editor and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.1"
          use-dotnet: false
          include-templates: true

      - name: Install Foundry Python package
        run: python -m pip install -e ".[dev]"

      - name: Create a CI-only Android debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Generate actual Blender assets and assemble a Godot game
        env:
          NEXORA_EXPORT_FIXTURE_DIR: ${{ runner.temp }}/nexora-game-project
        run: pytest -q tests/integration/test_blender_to_godot.py

      - name: Export Linux desktop build
        run: |
          python scripts/release/export_game.py \
            --project "${{ runner.temp }}/nexora-game-project" \
            --target linux \
            --mode debug \
            --output dist/release/linux

      - name: Export Windows desktop build
        run: |
          python scripts/release/export_game.py \
            --project "${{ runner.temp }}/nexora-game-project" \
            --target windows \
            --mode debug \
            --output dist/release/windows

      - name: Export Android debug APK
        run: |
          python scripts/release/export_game.py \
            --project "${{ runner.temp }}/nexora-game-project" \
            --target android \
            --mode debug \
            --output dist/release/android

      - name: Verify release checksums
        run: |
          (cd dist/release/linux && sha256sum -c checksums.sha256)
          (cd dist/release/windows && sha256sum -c checksums.sha256)
          (cd dist/release/android && sha256sum -c checksums.sha256)

      - name: Upload creator-test release candidates
        uses: actions/upload-artifact@v4
        with:
          name: nexora-foundry-desktop-android-debug-builds
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
