name: PGF CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  godot-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.1"
          use-dotnet: false
          include-templates: false
      - name: Parse and run an assembled world
        run: pytest -q tests/integration/test_godot_runtime.py

  blender-godot-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y blender python3-numpy
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.1"
          use-dotnet: false
          include-templates: false
      - run: python -m pip install -e ".[dev]"
      - name: Generate real Blender assets and run the Godot game
        env:
          NEXORA_EXPORT_PROJECT_DIR: ${{ runner.temp }}/nexora-export-game
        run: pytest -q tests/integration/test_blender_to_godot.py
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-export-project
          path: ${{ runner.temp }}/nexora-export-game
          if-no-files-found: error
          retention-days: 2

  native-exports:
    runs-on: ubuntu-latest
    needs: [blender-godot-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android export SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.1"
          use-dotnet: false
          include-templates: true
      - uses: actions/download-artifact@v4
        with:
          name: nexora-export-project
          path: ${{ runner.temp }}/nexora-export-game
      - name: Configure Godot Android export environment
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          godot --headless --path "${{ runner.temp }}/nexora-export-game" --editor --quit
      - name: Export Linux desktop build
        run: |
          mkdir -p "${{ runner.temp }}/nexora-export-game/build/linux"
          godot --headless --path "${{ runner.temp }}/nexora-export-game" --export-release "Linux/X11" "${{ runner.temp }}/nexora-export-game/build/linux/NexoraFoundry.x86_64"
          test -s "${{ runner.temp }}/nexora-export-game/build/linux/NexoraFoundry.x86_64"
      - name: Export Android debug APK
        run: |
          mkdir -p "${{ runner.temp }}/nexora-export-game/build/android"
          godot --verbose --headless --path "${{ runner.temp }}/nexora-export-game" --export-debug "Android" "${{ runner.temp }}/nexora-export-game/build/android/NexoraFoundry-debug.apk"
          test -s "${{ runner.temp }}/nexora-export-game/build/android/NexoraFoundry-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-foundry-native-builds
          path: |
            ${{ runner.temp }}/nexora-export-game/build/linux/NexoraFoundry.x86_64
            ${{ runner.temp }}/nexora-export-game/build/android/NexoraFoundry-debug.apk
          if-no-files-found: error
          retention-days: 14
