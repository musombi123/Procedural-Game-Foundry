name: PGF CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora_test
          POSTGRES_DB: nexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://nexora:nexora_test@localhost:5432/nexora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,cloud]"
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  godot-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.1"
          use-dotnet: false
          include-templates: false
      - name: Parse and run an assembled world
        run: pytest -q tests/integration/test_godot_runtime.py

  blender-godot-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y blender python3-numpy
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.1"
          use-dotnet: false
          include-templates: false
      - run: python -m pip install -e ".[dev]"
      - name: Generate and normalize creator assets, then run the Godot game
        env:
          NEXORA_EXPORT_PROJECT_DIR: ${{ runner.temp }}/nexora-export-game
        run: >-
          pytest -q
          tests/integration/test_blender_asset_normalization.py
          tests/integration/test_blender_to_godot.py
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-export-project
          path: ${{ runner.temp }}/nexora-export-game
          if-no-files-found: error
          retention-days: 2

  native-exports:
    runs-on: ubuntu-latest
    needs: [blender-godot-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android export SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.1"
          use-dotnet: false
          include-templates: true
      - uses: actions/download-artifact@v4
        with:
          name: nexora-export-project
          path: ${{ runner.temp }}/nexora-export-game
      - name: Configure Godot Android export environment
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          test -x "$ANDROID_HOME/build-tools/35.0.1/apksigner"
          test -d "$ANDROID_HOME/ndk/28.1.13356709"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          godot --headless --path "${{ runner.temp }}/nexora-export-game" --editor --quit
          test -f "$HOME/.config/godot/editor_settings-4.6.tres"
          grep -F 'export/android/android_sdk_path = "/usr/local/lib/android/sdk"' "$HOME/.config/godot/editor_settings-4.6.tres"
      - name: Install desktop headless display
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xvfb
      - name: Export and launch Linux desktop build
        run: |
          mkdir -p "${{ runner.temp }}/nexora-export-game/build/linux"
          godot --headless --path "${{ runner.temp }}/nexora-export-game" --export-release "Linux/X11" "${{ runner.temp }}/nexora-export-game/build/linux/NexoraFoundry.x86_64"
          DESKTOP_BUILD="${{ runner.temp }}/nexora-export-game/build/linux/NexoraFoundry.x86_64"
          test -s "$DESKTOP_BUILD"
          chmod +x "$DESKTOP_BUILD"
          set +e
          timeout 20s xvfb-run -a "$DESKTOP_BUILD" > "${{ runner.temp }}/nexora-desktop-runtime.log" 2>&1
          runtime_status=$?
          set -e
          if [ "$runtime_status" -ne 124 ]; then
            cat "${{ runner.temp }}/nexora-desktop-runtime.log"
            echo "Desktop game did not remain alive for the 20-second runtime smoke test (exit=$runtime_status)."
            exit 1
          fi
          if grep -E "SCRIPT ERROR:|FATAL|Segmentation fault" "${{ runner.temp }}/nexora-desktop-runtime.log"; then
            cat "${{ runner.temp }}/nexora-desktop-runtime.log"
            exit 1
          fi
      - name: Export and verify Android debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cp "$HOME/.android/debug.keystore" "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"
          mkdir -p "${{ runner.temp }}/nexora-export-game/build/android"
          godot --verbose --headless --path "${{ runner.temp }}/nexora-export-game" --export-debug "Android" "${{ runner.temp }}/nexora-export-game/build/android/NexoraFoundry-debug.apk"
          APK="${{ runner.temp }}/nexora-export-game/build/android/NexoraFoundry-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "${{ runner.temp }}/nexora-export-game/build/android/NexoraFoundry-debug.apk.sha256"
      - name: Stage emulator smoke-test package
        run: |
          mkdir -p "${{ runner.temp }}/nexora-emulator-package"
          cp "${{ runner.temp }}/nexora-export-game/build/android/NexoraFoundry-debug.apk" "${{ runner.temp }}/nexora-emulator-package/"
          cp "${{ runner.temp }}/nexora-export-game/build/linux/NexoraFoundry.x86_64" "${{ runner.temp }}/nexora-emulator-package/"
      - uses: actions/upload-artifact@v4
        with:
          name: nexora-foundry-native-builds
          path: ${{ runner.temp }}/nexora-emulator-package/*
          if-no-files-found: error
          retention-days: 14

  android-emulator-smoke:
    runs-on: ubuntu-latest
    needs: [native-exports]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nexora-foundry-native-builds
          path: artifacts
      - name: Install APK on Android emulator and verify launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            APK="$(find artifacts -type f -name 'NexoraFoundry-debug.apk' -print -quit)"
            test -n "$APK"
            adb install "$APK"
            adb shell monkey -p org.nexora.foundry 1
            sleep 25
            adb shell pidof org.nexora.foundry
            if adb logcat -d -t 2000 | grep -E "FATAL EXCEPTION|Process: org.nexora.foundry.*has died"; then
              echo "NEXORA Android process crashed during launch smoke test."
              exit 1
            fi
            adb shell dumpsys activity activities | grep -F 'org.nexora.foundry'
