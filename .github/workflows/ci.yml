name: PGF CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  godot-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.1"
          use-dotnet: false
          include-templates: false
      - name: Parse and run an assembled world
        run: pytest -q tests/integration/test_godot_runtime.py

  blender-godot-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y blender python3-numpy
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.1"
          use-dotnet: false
          include-templates: false
      - run: python -m pip install -e ".[dev]"
      - name: Generate real Blender assets and run the Godot game
        run: pytest -q tests/integration/test_blender_to_godot.py
