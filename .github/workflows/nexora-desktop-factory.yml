name: NEXORA desktop factory local API tests

on:
  pull_request:
    paths:
      - "services/worker/desktop_factory.py"
      - "services/worker/local_agent.py"
      - "tests/worker/test_desktop_factory.py"
      - ".github/workflows/nexora-desktop-factory.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "services/worker/desktop_factory.py"
      - "services/worker/local_agent.py"
      - "tests/worker/test_desktop_factory.py"
  workflow_dispatch:

jobs:
  local-factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile local agent and factory APIs
        run: python -m compileall -q services/worker
      - name: Test desktop factory workspace, ownership and recovery
        run: pytest -q tests/worker/test_desktop_factory.py
