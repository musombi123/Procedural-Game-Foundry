[build-system]
requires = ["setuptools>=68","wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "procedural-game-foundry"
version = "0.1.0"
description = "Model-free procedural game creation studio"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1","uvicorn[standard]>=0.27,<1","pydantic>=2.6,<3","python-multipart>=0.0.9,<1"]
[project.optional-dependencies]
cloud = ["psycopg[binary]>=3.2,<4", "boto3>=1.35,<2", "httpx>=0.27,<1"]
dev = ["pytest>=8,<9","httpx>=0.27,<1"]
desktop = ["pyinstaller>=6.10,<7"]
[tool.setuptools.packages.find]
where = ["."]
include = ["core*","services*","generators*","nexora_device_bridge*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
