# Tools-only local pipeline configuration. No neural model weights or inference runtimes.
profile: local-tools
media:
  ffmpeg: required
  ffprobe: required
  scene_cut_threshold: 0.35
  maximum_keyframes: 24
geometry:
  blender: required_for_glb_export
  generator: deterministic-procedural-v1
  coordinate_system: right-handed-y-up
runtime:
  godot: required_for_playable_game_export

